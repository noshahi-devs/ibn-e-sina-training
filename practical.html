const sections=[
{key:"html",name:"HTML",range:"Days 1–6",icon:"🌐",desc:"Build the structure and content of web pages.",start:0,end:5},
{key:"css",name:"CSS",range:"Days 7–14",icon:"🎨",desc:"Style pages, create layouts and make websites responsive.",start:6,end:13},
{key:"bootstrap",name:"Bootstrap 5",range:"Days 15–18",icon:"🅱️",desc:"Build responsive interfaces with a component framework.",start:14,end:17},
{key:"javascript",name:"JavaScript",range:"Days 19–27",icon:"⚡",desc:"Learn programming logic and add interactivity to websites.",start:18,end:26},
{key:"final",name:"Final Project",range:"Days 28–30",icon:"🚀",desc:"Combine all four technologies in a complete website.",start:27,end:29}
];
const slides=[];
slides.push({type:"cover",title:"Welcome"});
slides.push({type:"schedule",title:"Time Distribution"});
sections.forEach(s=>{slides.push({type:"section",section:s,title:s.name});for(let i=s.start;i<=s.end;i++)slides.push({type:"day",data:daily[i],title:"Day "+daily[i].day});});
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function list(items){return `<ul>${items.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`}
function renderSlide(s,index){
 if(s.type==="cover")return `<section class="slide active" data-index="${index}"><div class="hero"><div class="eyebrow">IBN-E-SINA DEVELOPERS</div><h1>WEB DEVELOPMENT<br><span>TRAINING</span></h1><div class="training">HTML · CSS · BOOTSTRAP · JAVASCRIPT</div><div class="hero-rule"></div><div class="instructor">INSTRUCTOR<b>ENGR. ADEEL NOSHAHI</b></div><div class="hero-tag">30-DAY BEGINNER TRAINING PROGRAM</div></div></section>`;
 if(s.type==="schedule")return `<section class="slide" data-index="${index}"><div class="kicker">Course orientation</div><h2>Daily Time Distribution</h2><p class="lead">A consistent class routine balances theory, discussion, demonstration and independent hands-on practice.</p><div class="card">${[
["1 Hour","Theory lecture","Whiteboard teaching: concepts, definitions, syntax, diagrams and examples."],
["30 Minutes","Revision & Q/A","Review the previous lesson, ask questions and clear student doubts."],
["15 Minutes","Break","Short rest before the practical session."],
["1 Hour","Practical demonstration","Instructor codes on screen and explains the implementation step by step."],
["2–3 Hours","Independent practical work","Students complete the daily task while the instructor supervises and supports them."]
].map((r,i)=>`<div class="time-row"><div class="time">${r[0]}</div><div><h3>${r[1]}</h3><p>${r[2]}</p></div></div>`).join("")}</div><div class="card task-card" style="margin-top:16px"><h3>Teaching approach</h3><p>Students should not only copy code. They must understand it, change it and write their own solutions. Move forward when the class has understood the core concept.</p></div></section>`;
 if(s.type==="section"){let a=s.section;return `<section class="slide" data-index="${index}"><div class="hero" style="min-height:520px"><div class="eyebrow">TRAINING MODULE · ${a.range.toUpperCase()}</div><h1>${a.icon} ${a.name}</h1><div class="training">${esc(a.desc)}</div><div class="hero-rule"></div><div class="instructor">IBN-E-SINA DEVELOPERS<b>Instructor: ENGR. ADEEL NOSHAHI</b></div><div class="hero-tag">THEORY · Q/A · DEMONSTRATION · STUDENT PRACTICE</div></div></section>`}
 const d=s.data;return `<section class="slide" data-index="${index}"><div class="kicker">${d.day<=6?"HTML":d.day<=14?"CSS":d.day<=18?"BOOTSTRAP 5":d.day<=27?"JAVASCRIPT":"FINAL PROJECT"} · DAILY LESSON</div><div class="section-head"><div class="section-icon">${d.day<=6?"🌐":d.day<=14?"🎨":d.day<=18?"🅱️":d.day<=27?"⚡":"🚀"}</div><div><div class="day-count">DAY ${d.day} OF 30</div><h2>${esc(d.title)}</h2></div></div><div class="grid">
 <div class="card"><h3>📚 Topics Covered</h3>${list(d.topics)}</div>
 <div class="card"><h3>💬 Revision & Question Answering</h3>${list(d.qa)}</div>
 <div class="card"><h3>🖥️ Instructor Practical Demonstration</h3>${list(d.demo)}</div>
 <div class="card task-card"><h3>✍️ Student Task / Assignment</h3>${list(d.task)}</div>
 ${d.outcome?`<div class="card wide"><h3>🎯 Expected Learning Outcome</h3><p>${esc(d.outcome)}</p></div>`:""}
 ${d.project?`<div class="card wide project-card"><h3>🏆 Practical Project Milestone</h3><p>This is a required project checkpoint. Students should complete the work independently, demonstrate it to the instructor and explain the code they wrote.</p></div>`:""}
 </div></section>`;
}
document.getElementById("slides").innerHTML=slides.map(renderSlide).join("");
let current=0;
const nav=document.getElementById("nav");
function buildNav(){
 let out=`<div class="nav-label">Presentation</div><button data-slide="0"><span>⌂</span><span class="txt">Title Page</span></button><button data-slide="1"><span>◷</span><span class="txt">Time Distribution</span></button><div class="nav-label">Course Curriculum</div>`;
 sections.forEach(s=>{out+=`<button class="group-head" data-toggle="${s.key}"><span>${s.icon}</span><span class="txt">${s.name} <small style="color:#94a3b8"> · ${s.range}</small></span><span class="chev">⌄</span></button><div id="group-${s.key}">${slides.map((sl,i)=>sl.type==="day"&&sl.data.day>=daily[s.start].day&&sl.data.day<=daily[s.end].day?`<button class="sub" data-slide="${i}"><span class="txt">Day ${sl.data.day} – ${esc(sl.data.title)}</span></button>`:"").join("")}</div>`});
 nav.innerHTML=out;
 nav.querySelectorAll("[data-slide]").forEach(b=>b.addEventListener("click",()=>show(Number(b.dataset.slide))));
 nav.querySelectorAll("[data-toggle]").forEach(b=>b.addEventListener("click",()=>{let el=document.getElementById("group-"+b.dataset.toggle);el.hidden=!el.hidden;b.querySelector(".chev").textContent=el.hidden?"›":"⌄"}));
}
buildNav();
function show(n){current=Math.max(0,Math.min(slides.length-1,n));document.querySelectorAll(".slide").forEach((el,i)=>el.classList.toggle("active",i===current));document.querySelectorAll("[data-slide]").forEach(b=>b.classList.toggle("active",Number(b.dataset.slide)===current));let s=slides[current];document.getElementById("crumb").textContent="Training / "+s.title;document.getElementById("progressText").textContent=(current+1)+" / "+slides.length;document.getElementById("progressBar").style.width=((current+1)/slides.length*100)+"%";document.getElementById("backBtn").disabled=current===0;document.getElementById("nextBtn").disabled=current===slides.length-1;window.scrollTo({top:0,behavior:"smooth"});if(window.innerWidth<=850)toggleSidebar(false)}
function move(delta){show(current+delta)}
function toggleSidebar(force){let sb=document.getElementById("sidebar"),shade=document.getElementById("shade"),main=document.getElementById("main"),bottom=document.getElementById("bottom");if(window.innerWidth<=850){let open=force===undefined?!sb.classList.contains("mobile-open"):force;sb.classList.toggle("mobile-open",open);shade.classList.toggle("show",open)}else{sb.classList.toggle("collapsed");main.classList.toggle("expanded");bottom.classList.toggle("expanded")}}
document.addEventListener("keydown",e=>{if(e.key==="ArrowRight")move(1);if(e.key==="ArrowLeft")move(-1)});
show(0);
</script>

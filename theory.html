const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function renderTopics(items){
  let html = `<ul class="topic-list">`;
  items.forEach(item => {
    if(Array.isArray(item)){
      html += `<ul class="sub-topics">${item.map(sub => `<li>${esc(sub)}</li>`).join("")}</ul>`;
    } else {
      html += `<li><div>${esc(item)}</div></li>`;
    }
  });
  html += `</ul>`;
  return html;
}

  theoryDays.forEach((d, i) => {
    out += `
      <button class="sub" data-slide="${i + 2}">
        <span>${d.icon}</span>
        <span class="txt">Day ${d.day} – ${esc(d.title.split('&')[0].trim())}</span>
      </button>
    `;
  });

  out += `
    <div class="nav-label">Summary & Wrap-Up</div>
    <button data-slide="12"><span>📊</span><span class="txt">10-Day Overview</span></button>
    <button data-slide="13"><span>📋</span><span class="txt">Teaching Guidelines</span></button>
  `;

  nav.innerHTML = out;
  nav.querySelectorAll("[data-slide]").forEach(b => {
    b.addEventListener("click", () => show(Number(b.dataset.slide)));
  });
}

function show(n){
  current = Math.max(0, Math.min(slides.length - 1, n));
  document.querySelectorAll(".slide").forEach((el, i) => el.classList.toggle("active", i === current));
  document.querySelectorAll("[data-slide]").forEach(b => b.classList.toggle("active", Number(b.dataset.slide) === current));
  let s = slides[current];
  document.getElementById("crumb").textContent = "Theory Bootcamp / " + s.title;
  document.getElementById("progressText").textContent = (current + 1) + " / " + slides.length;
  document.getElementById("progressBar").style.width = ((current + 1) / slides.length * 100) + "%";
  document.getElementById("backBtn").disabled = current === 0;
  document.getElementById("nextBtn").disabled = current === slides.length - 1;
  window.scrollTo({top: 0, behavior: "smooth"});
  if(window.innerWidth <= 890) toggleSidebar(false);
}

function move(delta){
  show(current + delta);
}

function toggleSidebar(force){
  let sb = document.getElementById("sidebar"),
      shade = document.getElementById("shade"),
      main = document.getElementById("main"),
      bottom = document.getElementById("bottom");

  if(window.innerWidth <= 890){
    let open = force === undefined ? !sb.classList.contains("mobile-open") : force;
    sb.classList.toggle("mobile-open", open);
    shade.classList.toggle("show", open);
  } else {
    sb.classList.toggle("collapsed");
    main.classList.toggle("expanded");
    bottom.classList.toggle("expanded");
  }
}

document.addEventListener("keydown", e => {
  if(e.key === "ArrowRight") move(1);
  if(e.key === "ArrowLeft") move(-1);
});

show(0);
